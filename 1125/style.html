<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  * {
    box-sizing: border-box;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* 따뜻한 저녁 무드의 파스텔 그라데이션 배경 */
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
  }

  .container {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    padding: 36px 28px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(180, 95, 65, 0.16), 0 1px 3px rgba(0, 0, 0, 0.05);
    width: 100%;
    max-width: 420px;
    animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .badge {
    display: inline-block;
    background-color: #fff2eb;
    color: #e85d2a;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 24px;
    font-weight: 800;
    color: #1e242b;
    letter-spacing: -0.5px;
  }

  .subtitle {
    margin: 0;
    font-size: 14px;
    color: #6b7684;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 700;
    color: #333d4b;
  }

  label span.req {
    color: #f0643b;
    margin-left: 2px;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 13px 15px;
    background-color: #f9fafb;
    border: 1.5px solid #e5e8eb;
    border-radius: 12px;
    font-size: 15px;
    color: #191f28;
    transition: all 0.2s ease;
  }

  input[type="text"]::placeholder, textarea::placeholder {
    color: #adb5bd;
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    background-color: #ffffff;
    border-color: #f0643b;
    box-shadow: 0 0 0 4px rgba(240, 100, 59, 0.14);
  }

  textarea {
    resize: vertical;
    min-height: 88px;
    line-height: 1.5;
  }

  button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #ff7a50 0%, #eb5328 100%);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 6px 16px rgba(235, 83, 40, 0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(235, 83, 40, 0.36);
  }

  button:active:not(:disabled) {
    transform: translateY(0);
  }

  button:disabled {
    background: #ced4da;
    box-shadow: none;
    cursor: not-allowed;
  }

  .complete-screen {
    display: none;
    text-align: center;
    padding: 36px 10px;
    animation: slideUp 0.4s ease;
  }

  .check-icon {
    width: 56px;
    height: 56px;
    background: #fff2eb;
    color: #eb5328;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 16px;
  }

  .complete-screen h3 {
    font-size: 22px;
    font-weight: 800;
    color: #1e242b;
    margin: 0 0 8px 0;
  }

  .complete-screen p {
    font-size: 14px;
    color: #6b7684;
    margin: 0;
    line-height: 1.5;
  }
</style>
