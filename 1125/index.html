<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11월25일 저녁 신청 받기</title>
  <?!= include('style'); ?>
</head>
<body>

  <div class="container">
    <!-- 입력 폼 영역 -->
    <div id="form-section">
      <div class="header">
        <span class="badge">🍽️ DINNER RSVP</span>
        <h2>11월25일 저녁 신청 받기</h2>
        <p class="subtitle">오늘 저녁 함께할 메뉴를 자유롭게 적어주세요</p>
      </div>

      <form id="menuForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="name">이름<span class="req">*</span></label>
          <input type="text" id="name" name="name" placeholder="예: 홍길동" required>
        </div>
        
        <div class="form-group">
          <label for="food">음식<span class="req">*</span></label>
          <input type="text" id="food" name="food" placeholder="드시고 싶은 메뉴를 입력하세요" required>
        </div>
        
        <div class="form-group">
          <label for="message">하고 싶은 말</label>
          <textarea id="message" name="message" placeholder="알레르기, 못 먹는 음식, 전할 말 등"></textarea>
        </div>
        
        <button type="submit" id="submitBtn">신청 완료하기</button>
      </form>
    </div>

    <!-- 제출 완료 영역 -->
    <div id="complete-section" class="complete-screen">
      <div class="check-icon">✓</div>
      <h3>답장 감사합니다.</h3>
      <p>메뉴 신청이 정상적으로 접수되었습니다.<br>이 창은 닫으셔도 됩니다.</p>
    </div>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '접수 중...';

      const formData = {
        name: document.getElementById('name').value.trim(),
        food: document.getElementById('food').value.trim(),
        message: document.getElementById('message').value.trim()
      };

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === 'success') {
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('complete-section').style.display = 'block';
          } else {
            alert('저장 중 오류가 발생했습니다: ' + response.message);
            submitBtn.disabled = false;
            submitBtn.textContent = '신청 완료하기';
          }
        })
        .withFailureHandler(function(error) {
          alert('서버 통신 오류가 발생했습니다: ' + error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = '신청 완료하기';
        })
        .saveResponse(formData);
    }
  </script>

</body>
</html>
