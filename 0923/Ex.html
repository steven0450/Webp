<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>간단한 CSS 예제</title>
	<style>
		body {
			margin: 0;
			padding: 40px;
			background-color: #f2f7ff;
			color: #24324a;
			font-family: Arial, sans-serif;
		}

		.card {
			max-width: 480px;
			margin: 0 auto;
			padding: 32px;
			background-color: white;
			border: 2px solid #b8d1ff;
			border-radius: 12px;
			text-align: center;
			box-shadow: 0 8px 20px rgba(36, 50, 74, 0.12);
		}

		h1 {
			margin-top: 0;
			color: #1769aa;
		}

		p {
			line-height: 1.6;
		}

		.button {
			display: inline-block;
			margin-top: 12px;
			padding: 12px 20px;
			background-color: #1769aa;
			color: white;
			border-radius: 6px;
			text-decoration: none;
		}

		.button:hover {
			background-color: #0d4775;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>CSS 예제</h1>
		<p>배경색, 글자색, 여백, 테두리, 그림자와 호버 효과를 사용한 간단한 카드입니다.</p>
		<a class="button" href="#">자세히 보기</a>
	</main>
</body>
</html>
