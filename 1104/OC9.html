<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        td {
            width: 50px;
            height: 50px;
            text-align: center;
        }
    </style>
    <script>
        let img = new Image();
        img.src = "rabbit.jpg";
        let select = 0;

        function changeImage() {
            document.images[select].src = "";
            document.images[select].width = 0;
            document.images[select].height = 0;
            select = Math.floor(Math.random() * 100);
            document.images[select].src = img.src;
            document.images[select].width = 40;
            document.images[select].height = 40;
        }

        function start() {
            for (let i = 0; i < 100; i++) {
                document.images[i].onclick = changeImage;
            }
            select = Math.floor(Math.random() * 100);
            changeImage();
        }
    </script>
</head>

<body onload="start()">
    <h2>마우스 클릭 연습</h2>
    <hr>
    <script>
        document.write("<table border='1'>");
        for (let i = 0; i < 10; i++) {
            document.write("<tr>");
            for (let j = 0; j < 10; j++) {
                document.write("<td><img src=''></td>");
            }
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>

</html>
