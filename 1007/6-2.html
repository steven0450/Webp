<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function over(obj) {
            obj.src = "media/banana.jpg";
        }

        function out(obj) {
            obj.src = "media/apple.jpg";
        }
    </script>
</head>

<body>
    <h2>마우스를 올려보세요.</h2>
    <hr>
    <img src="media/apple.jpg" alt="이미지" width="300" height="300" onmouseover="over(this)" onmouseout="out(this)">
</body>

</html>
