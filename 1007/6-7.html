<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>리터럴</h2>
    <hr>
    <script>
        let oct = 015; // 015는 8진수, 10진수로 13
        let hex = 0x15; // 0x15는 16진수, 10진수로 21
        let condition = true; // True라고 적으면 안됨.

        document.write("8진수 015는 10진수로 " + oct + "<br>");
        document.write("16진수 0x15는 10진수로 " + hex + "<br>");
        document.write("condition은 " + condition + "<br>");
        document.write("문자열 : 단일인용부호로도 표현" + "<br>");
        document.write("그녀는 \"누구세요?\"라고 물었다." + "<br>");
    </script>
</body>

</html>
