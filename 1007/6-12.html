<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>조건 연산</h2>
    <hr>
    <script>
        let a = 3, b = 5;
        document.write("a = " + a + ", b = " + b + "<br><br>");
        document.write("두 수의 차이 : " + (a > b ? a - b : b - a) + "<br>");
    </script>
</body>

</html>
