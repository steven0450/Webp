<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>별 문자 출력하기</h2>
    <hr>
    <script>
        let star = prompt("정수를 입력하세요.");
        for (let i = 1; i <= star; i++) {
            for (let j = 1; j <= i; j++) {
                document.write("*");
            }
            document.write("<br>");
        }

        if (isNaN(star)) {
            document.write("입력 오류입니다.");
        }
    </script>
</body>

</html>
